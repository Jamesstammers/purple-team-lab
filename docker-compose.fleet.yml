# ─────────────────────────────────────────────────────────────
#  Fleet overlay — adds Fleet Server + Kibana Fleet preconfig.
#  Enabled by start-lab.sh when INGEST=elastic-agent (.env).
#  Usage: docker compose -f docker-compose.yml -f docker-compose.fleet.yml up -d
# ─────────────────────────────────────────────────────────────

services:

  # Mount Fleet preconfiguration into Kibana (ES creds/keys still via env).
  kibana:
    volumes:
      - ./fleet/kibana.fleet.yml:/usr/share/kibana/config/kibana.yml:ro

  # Fleet Server (Elastic Agent in fleet-server mode). It self-generates its
  # service token from Kibana using the elastic credentials below — no separate
  # setup step or shared token file.
  fleet-server:
    image: docker.elastic.co/elastic-agent/elastic-agent:${STACK_VERSION}
    container_name: pl-fleet-server
    depends_on:
      kibana:
        condition: service_healthy
    environment:
      - FLEET_SERVER_ENABLE=1
      - FLEET_SERVER_ELASTICSEARCH_HOST=http://elasticsearch:9200
      - FLEET_SERVER_ELASTICSEARCH_USERNAME=elastic
      - FLEET_SERVER_ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_FLEET_HOST=http://kibana:5601
      - KIBANA_FLEET_USERNAME=elastic
      - KIBANA_FLEET_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_FLEET_SETUP=1
      - FLEET_SERVER_POLICY_ID=fleet-server-policy
      - FLEET_SERVER_INSECURE_HTTP=1
      - FLEET_SERVER_HOST=0.0.0.0
      - FLEET_SERVER_PORT=8220
    ports:
      - "8220:8220"
    restart: unless-stopped
    networks:
      purplelab:
        ipv4_address: 172.30.0.40
